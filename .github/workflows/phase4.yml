name: Aura regression gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AURA_PGLITE_MODULE: /tmp/aura-test-deps/node_modules/@electric-sql/pglite
      AURA_UI_TEST_MODULES: /tmp/aura-test-deps/node_modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install test-only database and DOM engines
        run: npm install --prefix /tmp/aura-test-deps --no-save @electric-sql/pglite@0.5.11 jsdom@30.1.3
      - name: Install backend contract-test dependencies
        run: >-
          python -m pip install 'fastapi==0.115.6' 'pydantic==2.10.6'
          'httpx>=0.27,<1' 'python-multipart>=0.0.9,<1' 'psycopg2-binary>=2.9,<3'
          'python-dotenv>=1,<2' 'email-validator>=2,<3' 'pwdlib[argon2]>=0.2,<1'
          'PyJWT>=2.8,<3' 'Pillow>=10,<13' 'PyMuPDF>=1.24,<2'
          'python-pptx>=1,<2' 'python-docx>=1.1,<2' 'numpy>=2,<2.8'
          'pgvector>=0.3,<1' 'requests>=2.32,<3' 'tzdata>=2024.1'
      - name: Backend, PostgreSQL ownership and scheduling checks
        run: python -m unittest discover -s evaluation -p 'check_*.py'
      - name: Frontend interaction checks
        run: node --test tests/frontend/studyPlan.dom.test.mjs tests/frontend/studyPlanModel.test.mjs
      - name: Measured offline regression thresholds
        run: python -m evaluation.phase4 --gate
      - name: Typecheck and production build
        run: npm run build
      - name: Save controlled evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-controlled-evaluation
          path: evaluation/reports/phase4.json
