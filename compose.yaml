# Local database only: backend, frontend and Ollama run on the host laptop.
services:
  db:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: ${DB_NAME:?Create backend/.env first}
      POSTGRES_USER: ${DB_USER:?Create backend/.env first}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Create backend/.env first}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - aura_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  aura_database:
